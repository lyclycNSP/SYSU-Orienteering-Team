backend:
  name: github
  repo: lyclycNSP/SYSU-Orienteering-Team
  branch: main

locale: zh_Hans
show_preview_links: false
media_folder: uploads
public_folder: uploads
display_url: https://lyclycnsp.github.io/SYSU-Orienteering-Team/team/

collections:
  - name: posts
    label: 比赛故事
    label_singular: 文章
    folder: content/posts
    create: true
    slug: '{{slug}}'
    identifier_field: title
    extension: md
    format: frontmatter
    summary: '{{title}}'
    fields:
      - {label: 标题, name: title, widget: string}
      - {name: category, widget: hidden, default: 比赛故事}
      - {label: 摘要, name: summary, widget: text}
      - {label: 日期, name: date, widget: datetime, required: false, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', default: ''}
      - {label: 作者, name: author, widget: string, required: false}
      - label: 封面插图或照片
        name: cover
        widget: image
        required: false
        hint: 可选。首页卡片顶部显示，建议横图；留空使用等高线图案。正文页会显示完整图片。
      - {label: 封面图片说明, name: cover_alt, widget: string, required: false, hint: 简短描述图片内容，方便屏幕阅读器使用。}
      - {name: example, widget: hidden, default: false}
      - {name: published, widget: hidden, default: true}
      - {label: 正文, name: body, widget: team-markdown}
  - name: rules
    label: 规章制度
    label_singular: 规程文章
    folder: content/rules
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    fields:
      - {label: 标题, name: title, widget: string}
      - {label: 简介, name: summary, widget: text}
      - {label: 日期, name: date, widget: datetime, required: false, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', default: ''}
      - {label: 作者或发布单位, name: author, widget: string, required: false}
      - {label: 封面插图或照片, name: cover, widget: image, required: false}
      - {label: 图片说明, name: cover_alt, widget: string, required: false}
      - {name: published, widget: hidden, default: true}
      - {label: 正文, name: body, widget: team-markdown}
  - name: tutorials
    label: 定向入门
    label_singular: 教程文章
    folder: content/tutorials
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    fields:
      - {label: 标题, name: title, widget: string}
      - {label: 简介, name: summary, widget: text}
      - {label: 日期, name: date, widget: datetime, required: false, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', default: ''}
      - {label: 作者或发布单位, name: author, widget: string, required: false}
      - {label: 封面插图或照片, name: cover, widget: image, required: false}
      - {label: 图片说明, name: cover_alt, widget: string, required: false}
      - {name: published, widget: hidden, default: true}
      - {label: 正文, name: body, widget: team-markdown}
  - name: notices
    label: 名单公示
    label_singular: 公示文章
    folder: content/notices
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    fields:
      - {label: 标题, name: title, widget: string}
      - {label: 简介, name: summary, widget: text}
      - {label: 日期, name: date, widget: datetime, required: false, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', default: ''}
      - {label: 作者或发布单位, name: author, widget: string, required: false}
      - {label: 封面插图或照片, name: cover, widget: image, required: false}
      - {label: 图片说明, name: cover_alt, widget: string, required: false}
      - {name: published, widget: hidden, default: true}
      - {label: 正文, name: body, widget: team-markdown}
  - name: downloads
    label: 资料下载
    files:
      - name: resources
        label: 下载资料列表
        file: content/resources.yml
        fields:
          - {label: 页面标题, name: title, widget: string}
          - {label: 简介, name: summary, widget: text}
          - label: 资料条目
            name: items
            widget: list
            summary: '{{fields.title}}'
            fields:
              - {label: 资料名称, name: title, widget: string}
              - {label: 说明, name: description, widget: text, required: false}
              - {label: 文件, name: file, widget: file, hint: 可上传 PDF、Word、表格等附件，或选择已上传文件。}
              - {label: 下载按钮文字, name: button, widget: string, default: 下载文件 ↓}
              - {label: 在线阅读地址, name: online_url, widget: string, required: false}
